<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon Explorer</title>
  <style>
    :root {
      --crater-label-color: #fcd34d;
      --crater-label-size: 1rem;
      --crater-label-weight: 700;
      --crater-label-y-offset: 50px;
    }

    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #030712;
      font-family: Arial, sans-serif;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #infoPanel {
      position: absolute;
      left: 24px;
      top: 5vh;
      bottom: 5vh;
      width: 20%;
      height: auto;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.8);
      color: white;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: block;
    }

    #themeControls {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.8);
      color: #dbeafe;
    }

    #themeSelector {
      min-width: 220px;
      padding: 6px 8px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 5px;
      background: #1e293b;
      color: #dbeafe;
      font: inherit;
    }

    #modeControls {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 8px;
    }

    #modeControls button {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.9);
      color: #dbeafe;
      cursor: pointer;
      font: inherit;
    }

    #modeControls button.active {
      background: #fcd34d;
      border-color: #fcd34d;
      color: #111827;
    }

    #guideFeatureSelector {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 85px;
      display: none;
      max-height: calc(100% - 170px);
      margin: 0;
      padding: 0;
      overflow-y: auto;
    }

    #guideFeatureSelector.visible {
      display: block;
    }

    #guideFeatureSelector p {
      margin: 0 0 8px;
      color: white;
    }

    #guideFeatureList {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #guideFeatureList button {
      display: block;
      width: 100%;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    #guideFeatureList button.selected {
      color: #f87171;
    }

    #guideFeatureList button.reached {
      color: #4ade80;
    }

    #guideFeatureList button.reached::after {
      content: "\2713";
      float: right;
      color: #4ade80;
      font-weight: 700;
    }

    #infoTitle {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
    }

    #infoText {
      margin: 0;
      line-height: 1.5;
      color: #dbeafe;
    }

    #targetStatus {
      position: absolute;
      left: 60%;
      top: calc(50% + 72px);
      transform: translateX(-50%);
      color: #fc764d;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      pointer-events: none;
      z-index: 20;
    }

    #infoLatitude {
      margin: 14px 0 0;
      color: #fcd34d;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    #infoLongitude {
      margin: 6px 0 0;
      color: #fcd34d;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    #infoDiameter {
      margin: 6px 0 0;
      color: #fcd34d;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    #infoDepth,
    #infoAge {
      margin: 6px 0 0;
      color: #fcd34d;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    #reticle {
      position: absolute;
      left: 60%;
      top: 50%;
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-top: -60px;
      opacity: 0.8;
      transform: scale(1);
      transition: opacity 0.12s ease, transform 0.12s ease, filter 0.12s ease;
      pointer-events: none;
      background-image: url("./reticle.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      filter: sepia(1) hue-rotate(0deg) saturate(8);
    }

    #reticle.active {
      opacity: 1;
    }

    #reticle.locked {
      transform: scale(1.1);
      filter: sepia(1) hue-rotate(90deg) saturate(8);
    }

    #guideArrow {
      position: absolute;
      display: none;
      color: #fcd34d;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 20;
    }

    #craterLabel {
      position: absolute;
      display: none;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - var(--crater-label-y-offset)));
      color: var(--crater-label-color);
      font-size: var(--crater-label-size);
      font-weight: var(--crater-label-weight);
      font-family: Arial, sans-serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>

<body>
  <canvas id="renderCanvas"></canvas>

  <div id="reticle"></div>
  <div id="guideArrow">&gt;</div>
  <div id="targetStatus"></div>
  <div id="craterLabel"></div>

  <div id="themeControls">
    <label for="themeSelector">Theme:</label>
    <select id="themeSelector" disabled>
      <option>Loading themes...</option>
    </select>
  </div>

  <div id="infoPanel">
    <h2 id="infoTitle">Crater</h2>
    <p id="infoText">Aim at craters to inspect.</p>
    <p id="infoLatitude">Latitude : --</p>
    <p id="infoLongitude">Longitude : --</p>
    <p id="infoDiameter">Diameter : -- km</p>
    <p id="infoDepth">Depth : -- km</p>
    <p id="infoAge">Age : -- billion years</p>
    <div id="guideFeatureSelector">
      <p>Select crater to find :</p>
      <ul id="guideFeatureList"></ul>
    </div>
    <div id="modeControls">
      <button id="guideModeButton" type="button">Guide Mode</button>
      <button id="exploreModeButton" class="active" type="button">Explore Mode</button>
    </div>
  </div>

  <script type="module" src="./moon_explorer.ts"></script>
</body>

</html>
